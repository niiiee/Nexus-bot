# docker-compose.selfhost.yml - Nexus 100% Self-Hosted Profile
services:
  # -------------------------------------------------------------
  # PostgreSQL 16 with pgvector Extension
  # -------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_db
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: nexus_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_user -d nexus_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # MinIO Object Storage (S3-Compatible API)
  # -------------------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Bucket auto-creation helper
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing local/nexus-private;
      /usr/bin/mc mb --ignore-existing local/nexus-public;
      /usr/bin/mc mb --ignore-existing local/nexus-backups;
      exit 0;
      "

  # -------------------------------------------------------------
  # Nexus Web & API Service
  # -------------------------------------------------------------
  nexus-web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/index.js", "--role=web"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://nexus_user:nexus_password@postgres:5432/nexus_db
      - STORAGE_DRIVER=s3
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=nexus-private
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_FORCE_PATH_STYLE=true
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434

  # -------------------------------------------------------------
  # Nexus Persistent Bot Worker
  # -------------------------------------------------------------
  nexus-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/index.js", "--role=worker"]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://nexus_user:nexus_password@postgres:5432/nexus_db
      - STORAGE_DRIVER=s3
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=nexus-private
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_FORCE_PATH_STYLE=true
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434

  # -------------------------------------------------------------
  # Optional: Local Ollama AI Engine
  # -------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  pgdata:
  miniodata:
  ollamadata:
