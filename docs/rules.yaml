version: "2.0.0"
adopted_at: "2026-09-30"
rules:
  - id: "R01"
    name_en: "Spam & Repetitive Messages"
    name_ar: "الرسائل المكررة والسبام"
    severity: "S1"
    mode: "A"
    points: 1
    decay_days: 30
    auto_max_action: "timeout_1h"
    description_en: "Do not flood channels with repeated messages, identical links, or meaningless text walls."
    description_ar: "ممنوع تكرار نفس الرسالة أو الروابط العشوائية أو إغراق الرومات بنصوص ملهاش لازمة."

  - id: "R02"
    name_en: "Hate Speech & Bigotry"
    name_ar: "خطاب الكراهية والتمييز"
    severity: "S3"
    mode: "H"
    points: 4
    decay_days: 90
    auto_max_action: "protective_hold"
    description_en: "Zero tolerance for slurs, discrimination, or degrading language based on race, religion, nationality, disability, gender, or dialect."
    description_ar: "مرفوض تماماً أي كلام فيه تمييز، إهانة، أو كراهية بسبب الدين، الجنسية، اللهجة، أو أي خلفية شخصية."

  - id: "R03"
    name_en: "Harassment, Bullying & Dogpiling"
    name_ar: "المضايقات والتنمر المستمر"
    severity: "S3"
    mode: "H"
    points: 4
    decay_days: 90
    auto_max_action: "protective_hold"
    description_en: "Do not repeatedly target, mock, intimidate, or orchestrate group attacks against any member across channels."
    description_ar: "ممنوع استهداف أي عضو بالسخرية أو التخويف أو التحريض عليه في الرومات العامة أو الخاصة."

  - id: "R04"
    name_en: "Doxxing & Non-Consensual PII"
    name_ar: "نشر البيانات الشخصية والخصوصية"
    severity: "S4"
    mode: "H"
    points: 0
    decay_days: 0
    auto_max_action: "emergency_hold"
    description_en: "Never post real names, home addresses, phone numbers, National IDs, or private photos without explicit verifiable consent."
    description_ar: "نشر أرقام تليفونات، بطاقات رقم قومي، عناوين، أو صور خاصة بدون إذن صاحبها ممنوع نهائياً."

  - id: "R05"
    name_en: "Scams, Phishing & Deceptive Links"
    name_ar: "الاحتيال وروابط التصيد"
    severity: "S4"
    mode: "H"
    points: 0
    decay_days: 0
    auto_max_action: "emergency_hold"
    description_en: "Do not share phishing links, fake Discord Nitro gifts, cryptocurrency scams, or malicious financial schemes."
    description_ar: "ممنوع نشر لينكات وهمية، سرقة حسابات، عروض نيترو مفبركة، أو أي نصب مالي."

  - id: "R06"
    name_en: "Staff & Member Impersonation"
    name_ar: "انتحال شخصية الإدارة أو الأعضاء"
    severity: "S3"
    mode: "H"
    points: 4
    decay_days: 90
    auto_max_action: "protective_hold"
    description_en: "Do not copy usernames, avatars, or roles to pose as staff, moderators, clients, or specific community members."
    description_ar: "ممنوع استخدام أسامي وصور مطابقة للمشرفين أو الأعضاء عشان توهم الناس إنك الإدارة."

  - id: "R07"
    name_en: "NSFW & Inappropriate Adult Content"
    name_ar: "المحتوى الإباحي وغير اللائق"
    severity: "S3"
    mode: "S"
    points: 4
    decay_days: 90
    auto_max_action: "hide_and_case"
    description_en: "Do not post pornography, sexually explicit media, gore, or graphic violence."
    description_ar: "السيرفر مجتمع تقني وتعليمي، ممنوع نشر أي محتوى إباحي أو دموي أو خادش للحياء."

  - id: "R08"
    name_en: "Malware, Exploits & Token Stealers"
    name_ar: "البرمجيات الخبيثة والملفات الضارة"
    severity: "S4"
    mode: "H"
    points: 0
    decay_days: 0
    auto_max_action: "emergency_hold"
    description_en: "Do not distribute viruses, keyloggers, token grabbers, or links designed to compromise member devices."
    description_ar: "ممنوع نشر ملفات مشبوهة، تروجان، سارقات توكن، أو أي كود بيضر جهاز المستخدم."

  - id: "R09"
    name_en: "Extortion, Blackmail & Coercion"
    name_ar: "الابتزاز والتهديد والضغط"
    severity: "S4"
    mode: "H"
    points: 0
    decay_days: 0
    auto_max_action: "emergency_hold"
    description_en: "Threatening to leak files, damage reputations, or sabotage work to force compliance is strictly prohibited."
    description_ar: "ممنوع ابتزاز أي فريلانسر أو عميل أو التهديد بنشر شغله أو سمعته عشان تجبره على حاجة."

  - id: "R10"
    name_en: "Violent Threats & Harm Incitement"
    name_ar: "التهديد بالعنف أو التحريض على الأذى"
    severity: "S4"
    mode: "H"
    points: 0
    decay_days: 0
    auto_max_action: "emergency_hold"
    description_en: "Do not threaten physical violence against others or encourage self-harm."
    description_ar: "أي تهديد بالاعتداء الجسدي أو تشجيع على إيذاء النفس بيترتب عليه إيقاف فوري وتدخل المشرفين."

  - id: "R11"
    name_en: "Portfolio Plagiarism & Credit Theft"
    name_ar: "سرقة الأعمال والادعاء الكاذب"
    severity: "S3"
    mode: "S"
    points: 4
    decay_days: 90
    auto_max_action: "hide_and_case"
    description_en: "Do not present someone else's code, design, or case study as your own original work."
    description_ar: "ممنوع تنسب شغل غيرك لنفسك في البورتفوليو أو تدعي إنك عملت مشروع أنت ملمستوش."

  - id: "R12"
    name_en: "Live Skill Test Cheating"
    name_ar: "الغش في اختبارات المهارة الحية"
    severity: "S3"
    mode: "H"
    points: 4
    decay_days: 90
    auto_max_action: "protective_hold"
    description_en: "Do not use ghostwriters, shared screens, or unauthorized remote assistance during live coding/design skill evaluations."
    description_ar: "ممنوع الاستعانة بحد يحل مكانك أو يكتبلك الكود في اختبار المهارة الحي الخاص بالسيرفر."

  - id: "R13"
    name_en: "Fabricated Seniority Claims"
    name_ar: "تضخيم الخبرة والادعاءات غير الحقيقية"
    severity: "S2"
    mode: "S"
    points: 2
    decay_days: 60
    auto_max_action: "hide_and_case"
    description_en: "Do not make fraudulent claims of years of senior experience to mislead beginners or clients."
    description_ar: "اتكلم عن خبرتك بصدق، بلاش تدعي سنين خبرة مش حقيقية علشان توهم الناس أو العملاء."

  - id: "R14"
    name_en: "Ban & Restriction Evasion"
    name_ar: "الهروب من العقوبات بحسابات بديلة"
    severity: "S3"
    mode: "H"
    points: 4
    decay_days: 90
    auto_max_action: "protective_hold"
    description_en: "Creating alt accounts to bypass a temporary restriction or moderation hold is forbidden."
    description_ar: "لو واخد عقوبة مؤقتة، بلاش تدخل بحساب تاني تهرب منها؛ دا بيضاعف المشكلة."

  - id: "R15"
    name_en: "Event & Voice Stage Disruption"
    name_ar: "تخريب الفعاليات والرومات الصوتية"
    severity: "S2"
    mode: "A"
    points: 2
    decay_days: 60
    auto_max_action: "timeout_1h"
    description_en: "Do not yell, play loud soundboards, interrupt guest speakers, or disrupt community workshops."
    description_ar: "احترم وقت الناس في الرومات الصوتية والورش، بلاش تشغيل أصوات مزعجة أو مقاطعة المحاضر."

  - id: "R16"
    name_en: "Bot Command Abuse & Flood"
    name_ar: "إساءة استخدام أوامر البوت"
    severity: "S1"
    mode: "A"
    points: 1
    decay_days: 30
    auto_max_action: "timeout_1h"
    description_en: "Do not spam slash commands, trigger infinite test loops, or intentionally try to crash community bots."
    description_ar: "بلاش سبام أوامر البوت في الشاتات العامة أو محاولة استهلاك الكوتة باستهبال."

  - id: "R17"
    name_en: "Charter Violation: Selling Core Features"
    name_ar: "بيع المزايا المجانية ومخالفة الميثاق"
    severity: "S3"
    mode: "S"
    points: 4
    decay_days: 90
    auto_max_action: "hide_and_case"
    description_en: "Core platform features (verification, learning, jobs, escrow) are free forever. Selling access is prohibited."
    description_ar: "خدمات نيكسس الأساسية مجانية للكل للأبد؛ ممنوع منعاً باتاً بيع أي ميزة أو فرض رسوم خاصة عليها."

  - id: "R18"
    name_en: "Charter Violation: Bribery & Pay-to-Win"
    name_ar: "دفع رشاوي أو شراء رتب وتأثير"
    severity: "S4"
    mode: "H"
    points: 0
    decay_days: 0
    auto_max_action: "emergency_hold"
    description_en: "Donations confer ZERO perks, roles, or votes. Offering money to influence moderation or rulings is banned."
    description_ar: "التبرع لصندوق المجتمع مش بيديك أي أفضلية ولا رتبة؛ ممنوع عرض فلوس لتغيير أي قرار."

  - id: "R19"
    name_en: "Client Confidentiality & NDA Leaks"
    name_ar: "تسريب أسرار العملاء وملفاتهم"
    severity: "S3"
    mode: "S"
    points: 4
    decay_days: 90
    auto_max_action: "hide_and_case"
    description_en: "Do not disclose private client source code, credentials, or proprietary business details without consent."
    description_ar: "حافظ على أمانة شغلك؛ ممنوع نشر كود خاص أو بيانات سرية لعميل بدون موافقته الصريحة."

  - id: "R20"
    name_en: "Off-Platform Payment Coercion"
    name_ar: "إجبار الفريلانسر على طرق دفع غير آمنة"
    severity: "S2"
    mode: "S"
    points: 2
    decay_days: 60
    auto_max_action: "hide_and_case"
    description_en: "Clients must not coerce freelancers into unverified payment rails or bypass agreed escrow terms."
    description_ar: "ممنوع العميل يضغط على الفريلانسر عشان يستلم بطرق مش متفق عليها أو يتهرب من الإسكرو."

  - id: "R21"
    name_en: "Fraudulent Job Postings & Unpaid Spec Work"
    name_ar: "الوظائف الوهمية والشغل المجاني"
    severity: "S3"
    mode: "S"
    points: 4
    decay_days: 90
    auto_max_action: "hide_and_case"
    description_en: "Job posts demanding free full deliverables as 'tests' or offering below-minimum scam compensation are removed."
    description_ar: "ممنوع نشر إعلانات تطلب شغل كامل تحت مسمى 'تاسك تجريبي مجاني'؛ حق الفريلانسر خط أحمر."

  - id: "R22"
    name_en: "Demanding Free Work in Help Channels"
    name_ar: "طلب شغل مجاني في رومات المساعدة"
    severity: "S2"
    mode: "A"
    points: 2
    decay_days: 60
    auto_max_action: "timeout_1h"
    description_en: "Technical help channels are for debugging and guidance, not for demanding free full-project coding."
    description_ar: "رومات المساعدة عشان تفهم وتصلح مشاكلك، مش عشان حد يعملك مشروعك كامل ببلاش."

  - id: "R23"
    name_en: "Hostile Freelancer-Client Communications"
    name_ar: "التعامل العدائي وغير المهني في الصفقات"
    severity: "S2"
    mode: "A"
    points: 2
    decay_days: 60
    auto_max_action: "timeout_1h"
    description_en: "Maintain professional standards in deal rooms. Insults, bad faith cancellations, and verbal abuse are penalized."
    description_ar: "اتعامل باحترافية في روم الصفقة؛ الشتيمة أو التهديد بإلغاء الصفقة باستهبال مرفوض."

  - id: "R24"
    name_en: "Member Mental Health Crisis & Care"
    name_ar: "دعم أزمات الصحة النفسية والتعب النفسي"
    severity: "Care"
    mode: "C"
    points: 0
    decay_days: 0
    auto_max_action: "care_outreach"
    description_en: "Expressions of severe distress, hopelessness, or self-harm receive IMMEDIATE compassionate crisis helpline resources. NO POINTS, NO PENALTIES."
    description_ar: "لو حد بيمر بأزمة نفسية أو بيكتب كلام فيه يأس وإيذاء نفس، بيتوفرله الدعم وأرقام المساعدة فوراً، وممنوع نهائياً تسجيل أي عقوبة أو نقاط عليه."

  - id: "R25"
    name_en: "Retaliatory Ratings & Whistleblower Abuse"
    name_ar: "التقييمات الانتقامية واضطهاد المبلّغين"
    severity: "S3"
    mode: "S"
    points: 4
    decay_days: 90
    auto_max_action: "hide_and_case"
    description_en: "Retaliating against a member for honest dispute reports, negative escrow reviews, or whistleblowing is prohibited."
    description_ar: "ممنوع تنتقم من حد كتب تقييم صريح أو بلغ عن مشكلة؛ أي تقييم كيدي بيتم فحصه وإلغاؤه فوراً."

  - id: "R26"
    name_en: "Non-Consensual Session Recording"
    name_ar: "تسجيل الجلسات بدون إذن الحاضرين"
    severity: "S2"
    mode: "S"
    points: 2
    decay_days: 60
    auto_max_action: "hide_and_case"
    description_en: "Do not record voice rooms, pair programming, or workshops without explicit upfront consent from all participants."
    description_ar: "ممنوع تسجل كلام حد في الرومات الصوتية أو شير الشاشة إلا بموافقة كل اللي حاضرين."

  - id: "R27"
    name_en: "Misrepresenting Deal Scope"
    name_ar: "التلاعب بنطاق الشغل ومواصفات التسليم"
    severity: "S2"
    mode: "S"
    points: 2
    decay_days: 60
    auto_max_action: "hide_and_case"
    description_en: "Deliberately altering agreed requirements mid-deal without compensating scope adjustments is flagged for mediation."
    description_ar: "ممنوع تغيير مواصفات الشغل في نص الطريق بدون اتفاق واضح وتعديل للمبلغ المتفق عليه."

  - id: "R28"
    name_en: "Refusing Dispute Ladder Process"
    name_ar: "رفض مسار حل النزاعات المتفق عليه"
    severity: "S2"
    mode: "S"
    points: 2
    decay_days: 60
    auto_max_action: "hide_and_case"
    description_en: "Both parties in an escrow deal must engage constructively in the neutral mediation ladder."
    description_ar: "الطرفين في الصفقة ملزمين بالرد على الميدلمان وجلسات الوساطة لحل الخلاف بموضوعية."

  - id: "R29"
    name_en: "Academic Dishonesty & Exam Cheating"
    name_ar: "حل امتحانات الجامعات والشهادات"
    severity: "S3"
    mode: "H"
    points: 4
    decay_days: 90
    auto_max_action: "protective_hold"
    description_en: "Do not hire or offer services for live cheating on university exams, certification tests, or thesis fabrication."
    description_ar: "ممنوع عروض أو طلبات حل امتحانات الكليات أو شهادات معتمدة؛ السيرفر لدعم التعلم الحقيقي فقط."

  - id: "R30"
    name_en: "Piracy & Copyright Infringement"
    name_ar: "نشر كورسات وبرامج مسروقة"
    severity: "S3"
    mode: "S"
    points: 4
    decay_days: 90
    auto_max_action: "hide_and_case"
    description_en: "Sharing pirated software, cracked license keys, or leaked commercial courses is not allowed."
    description_ar: "ممنوع نشر كراكات أو كورسات مدفوعة مسروقة؛ بنشجع الموارد المفتوحة والمجانية القانونية فقط."

  - id: "R31"
    name_en: "Off-Topic & Wrong Channel Usage"
    name_ar: "استخدام الرومات في غير تخصصها"
    severity: "S1"
    mode: "A"
    points: 1
    decay_days: 30
    auto_max_action: "timeout_1h"
    description_en: "Post content in designated channels (e.g. keep code questions in #tech-help, jobs in #jobs)."
    description_ar: "حط كل حاجة في مكانها المناسب (الأسئلة التقنية في روماتها، والوظائف في روم الوظائف)."

  - id: "R32"
    name_en: "Mass Pings & Unnecessary Mentions"
    name_ar: "المنشن العشوائي ومنشن الجميع"
    severity: "S1"
    mode: "A"
    points: 1
    decay_days: 30
    auto_max_action: "timeout_1h"
    description_en: "Do not use @everyone, @here, or mass ping staff without valid emergency justification."
    description_ar: "بلاش منشن عمال على بطال للناس أو المشرفين؛ منشن لما تكون محتاج حاجة ضرورية فعلاً."

  - id: "R33"
    name_en: "Flame-Baiting & Bad-Faith Trolling"
    name_ar: "إشعال الخلافات والجدال العقيم"
    severity: "S1"
    mode: "A"
    points: 1
    decay_days: 30
    auto_max_action: "timeout_1h"
    description_en: "Avoid provocative, bad-faith arguments designed only to annoy or provoke emotional outbursts."
    description_ar: "النقاش التقني البناء مطلوب، بس الجدال لمجرد العند واستفزاز الناس مرفوض."

  - id: "R34"
    name_en: "Divisive Political & Religious Debates"
    name_ar: "الخلافات السياسية والدينية الحادة"
    severity: "S2"
    mode: "A"
    points: 2
    decay_days: 60
    auto_max_action: "timeout_1h"
    description_en: "Keep technical and professional spaces free from heated political or religious arguments."
    description_ar: "السيرفر مكان للشغل والتعلم؛ تجنب النقاشات السياسية أو الدينية اللي بتعمل حساسية وخلافات."

  - id: "R35"
    name_en: "Violating Quiet Hours & Focus Rooms"
    name_ar: "إزعاج رومات التركيز وساعات الهدوء"
    severity: "S1"
    mode: "A"
    points: 1
    decay_days: 30
    auto_max_action: "timeout_1h"
    description_en: "Respect quiet hours (22:00–06:00 UTC) and Pomodoro study rooms by minimizing loud alerts."
    description_ar: "احترم ساعات الهدوء ورومات التركيز (بومودورو)؛ حافظ على الهدوء عشان زمايلك شغالين."

  - id: "R36"
    name_en: "Fabricated Testimonials & Client Reviews"
    name_ar: "الفيدباك المفبرك والتقييمات المزيفة"
    severity: "S2"
    mode: "S"
    points: 2
    decay_days: 60
    auto_max_action: "hide_and_case"
    description_en: "Do not create fake client accounts to leave glowing reviews on your own portfolio."
    description_ar: "ممنوع عمل حسابات فيك عشان تكتب لنفسك ريفيوهات ممتازة؛ التقييم لازم يكون من عميل حقيقي."

  - id: "R37"
    name_en: "Collusion Rings for Kudos & Rep"
    name_ar: "شبكات تبادل النقاط واللايكات الوهمية"
    severity: "S2"
    mode: "S"
    points: 2
    decay_days: 60
    auto_max_action: "hide_and_case"
    description_en: "Do not form circular groups that trade fake kudos, badges, or endorsements without real work."
    description_ar: "ممنوع تتفق مع أصحابك تدو بعض كودوز ونقاط سمعة بدون مساعدة أو شغل حقيقي."

  - id: "R38"
    name_en: "Scraping Member Directory & Lead Poaching"
    name_ar: "سحب بيانات الأعضاء والتواصل التطفلي"
    severity: "S3"
    mode: "H"
    points: 4
    decay_days: 90
    auto_max_action: "protective_hold"
    description_en: "Scraping server member lists or mass-DMing members with unsolicited job pitches is forbidden."
    description_ar: "ممنوع سحب داتا الأعضاء أو إرسال رسائل خاصة جماعية للترويج بدون إذن."

  - id: "R39"
    name_en: "Exploiting Bot Bugs & Economy Glitches"
    name_ar: "استغلال ثغرات البوت واقتصاد السيرفر"
    severity: "S3"
    mode: "H"
    points: 4
    decay_days: 90
    auto_max_action: "protective_hold"
    description_en: "If you find a bug in points, economy, or permissions, report it. Exploiting it leads to immediate action."
    description_ar: "لو لقيت ثغرة في البوت، بلغ عنها في سكات وخود شكر في لوحة الشرف؛ متستغلهاش."

  - id: "R40"
    name_en: "Unsolicited Promotional DMs"
    name_ar: "الرسائل الإعلانية المزعجة في الخاص"
    severity: "S2"
    mode: "A"
    points: 2
    decay_days: 60
    auto_max_action: "timeout_1h"
    description_en: "Do not send unsolicited promotional DMs to members you do not know."
    description_ar: "ممنوع دخول خاص لأعضاء متعرفهمش عشان تبعتلهم إعلانات لخدماتك أو قنواتك."

  - id: "R41"
    name_en: "Youth Safety: Unmonitored Adult-Minor DMs"
